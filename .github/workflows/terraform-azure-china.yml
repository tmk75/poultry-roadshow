name: Terraform Azure China IaC Verification

on:
  push:
    branches: [ main, master ]
    paths:
      - "sunner-cloud-gea/terraform/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "sunner-cloud-gea/terraform/**"

jobs:
  terraform-validate:
    name: Terraform Lint & Azure China Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunner-cloud-gea/terraform

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verify China Data Sovereignty (CSL/DSL/PIPL)
        run: |
          grep -E "chinaeast2|chinanorth3" variables.tf || (echo "ERROR: Cloud resources must target Azure China regions!" && exit 1)
          echo "Data localization in China East 2 verified."
