<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunner UI previews</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #061014;
      color: #E8F6F3;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 900px;
    }
    a {
      display: block;
      padding: 2rem;
      border: 1px solid rgba(20, 210, 182, 0.2);
      border-radius: 18px;
      background: rgba(12, 31, 38, 0.8);
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    a:hover {
      transform: translateY(-4px);
      border-color: #14D2B6;
    }
    h2 { margin: 0 0 0.5rem; }
    p { margin: 0; color: #A5C6C0; }
    @media (max-width: 640px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/">
      <h2>Dark mission-control UI</h2>
      <p>React + FastAPI app currently in use.</p>
    </a>
    <a href="/preview/design-warm.html">
      <h2>Warm poultry UI mockup</h2>
      <p>Single-file HTML alternative from design (1).html.</p>
    </a>
  </div>
</body>
</html>
