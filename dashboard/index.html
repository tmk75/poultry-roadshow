<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEA × Digit(AI) · PFA Poultry</title>
  <meta name="description" content="A lightweight digital twin and AI operating layer for the poultry processing plant.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="blob b5"></span>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/image2.png" class="brand-yolk" alt="">
        <div class="brand-text">
          <span class="brand-mark">GEA × Digit(AI)</span>
          <span class="brand-sub" data-i18n="brand.sub"></span>
        </div>
      </div>

      <nav class="tabs" aria-label="Primary">
        <button class="tab active" data-view="line"><span data-i18n="nav.line"></span></button>
        <button class="tab" data-view="agents"><span data-i18n="nav.agents"></span></button>
        <button class="tab" data-view="twin"><span data-i18n="nav.twin"></span></button>
        <button class="tab" data-view="roadshow"><span data-i18n="nav.roadshow"></span></button>
      </nav>

      <div class="topbar-actions">
        <span class="health-dot" title="online"></span>
        <button id="langToggle" class="lang-toggle" type="button">中文</button>
      </div>
    </header>

    <main class="content">
      <!-- LIVE LINE -->
      <section id="view-line" class="view active" aria-labelledby="line-title">
        <div class="hero with-art">
          <p class="eyebrow" data-i18n="line.eyebrow"></p>
          <span class="hero-badge" data-i18n="line.badge"></span>
          <h1 id="line-title" data-i18n="line.title"></h1>
          <p class="lede" data-i18n="line.lede"></p>
          <div class="hero-art" aria-hidden="true">
            <img src="assets/image1.png" class="art-main" alt="">
            <img src="assets/image2.png" class="art-yolk" alt="">
            <img src="assets/image3.png" class="art-chick" alt="">
          </div>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>

        <section class="panel">
          <div class="panel-head">
            <h2 data-i18n="line.flowTitle"></h2>
            <span class="live-pill"><span class="pulse"></span>LIVE</span>
          </div>
          <div id="stageFlow" class="stage-flow"></div>
        </section>

        <div class="two-col">
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="line.feedTitle"></h2></div>
            <div id="telemetryFeed" class="feed"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="line.alertsTitle"></h2></div>
            <div id="alerts" class="alerts"></div>
          </section>
        </div>
      </section>

      <!-- AI AGENTS -->
      <section id="view-agents" class="view" aria-labelledby="agents-title">
        <div class="hero">
          <p class="eyebrow" data-i18n="agents.eyebrow"></p>
          <h1 id="agents-title" data-i18n="agents.title"></h1>
          <p class="lede" data-i18n="agents.lede"></p>
        </div>
        <div class="agent-grid" id="agentGrid"></div>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n="agents.negotiation"></h2></div>
          <div id="negotiationFeed" class="feed"></div>
        </section>
      </section>

      <!-- DIGITAL TWIN -->
      <section id="view-twin" class="view" aria-labelledby="twin-title">
        <div class="hero">
          <p class="eyebrow" data-i18n="twin.eyebrow"></p>
          <h1 id="twin-title" data-i18n="twin.title"></h1>
          <p class="lede" data-i18n="twin.lede"></p>
        </div>
        <section class="panel">
          <div class="panel-head">
            <h2 data-i18n="twin.biTitle"></h2>
            <span class="bi-live" data-i18n="twin.live"></span>
          </div>
          <div class="bi-kpis" id="biKpis"></div>
          <div class="bi-grid">
            <article class="bi-card bi-card--wide">
              <header class="bi-card-head"><h3 data-i18n="twin.trendTitle"></h3></header>
              <div id="biTrend" class="bi-chart"></div>
            </article>
            <article class="bi-card">
              <header class="bi-card-head"><h3 data-i18n="twin.healthTitle"></h3></header>
              <div id="biGauge" class="bi-gauge"></div>
            </article>
            <article class="bi-card bi-card--wide">
              <header class="bi-card-head"><h3 data-i18n="twin.stageTitle"></h3></header>
              <div id="biBars" class="bi-bars"></div>
            </article>
            <article class="bi-card">
              <header class="bi-card-head"><h3 data-i18n="twin.alertsTitle"></h3></header>
              <div id="biAlerts" class="bi-alerts"></div>
            </article>
          </div>
          <div class="bi-table-wrap">
            <table class="bi-table" id="biTable"></table>
          </div>
        </section>
      </section>

      <!-- ROADSHOW -->
      <section id="view-roadshow" class="view" aria-labelledby="roadshow-title">
        <div class="hero">
          <p class="eyebrow" data-i18n="roadshow.eyebrow"></p>
          <h1 id="roadshow-title" data-i18n="roadshow.title"></h1>
        </div>
        <div class="roadshow-toolbar">
          <div class="mode-switch" id="roadshowMode">
            <button type="button" class="mode-btn active" data-mode="ppt">PPT</button>
            <button type="button" class="mode-btn" data-mode="story" data-i18n="roadshow.narrative"></button>
          </div>
          <div class="toolbar-actions">
            <button id="deckAutoplay" class="btn active" type="button" aria-pressed="true"><span data-i18n="roadshow.autoplay"></span></button>
            <button id="deckFullscreen" class="btn" type="button"><span data-i18n="roadshow.fullscreen"></span></button>
            <a class="btn primary" href="assets/GEA_DigitAI_Sunner_poultry_v4.pptx" download><span data-i18n="roadshow.ppt"></span></a>
          </div>
        </div>
        <section class="deck" id="deck"></section>
        <div class="deck-progress" aria-hidden="true"><span id="deckProgress"></span></div>
        <div class="deck-controls">
          <button id="deckPrev" class="btn" type="button"><span data-i18n="roadshow.prev"></span></button>
          <span id="deckCounter" class="deck-counter"></span>
          <button id="deckNext" class="btn primary" type="button"><span data-i18n="roadshow.next"></span></button>
        </div>
        <div class="slide-dots" id="slideDots"></div>
        <p class="deck-hint" data-i18n="roadshow.note"></p>
      </section>
    </main>
  </div>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="flow.js"></script>
  <script src="app.js"></script>
</body>
</html>
